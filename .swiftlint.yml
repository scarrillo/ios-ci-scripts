disabled_rules:
 - todo
 - no_space_in_method_call
 - comment_spacing
 - multiple_closures_with_trailing_closure
 - redundant_string_enum_value

# Exclude generated code and dependency directories
excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData

line_length:
  warning: 200
  error: 300
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true



function_body_length:
  warning: 75
  error: 150

function_parameter_count:
  warning: 6
  error: 8

file_length:
  warning: 1200
  error: 1500

type_body_length:
  warning: 450
  error: 550

cyclomatic_complexity:
  warning: 20
  error: 35


reporter: "xcode"
